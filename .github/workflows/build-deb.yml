name: Build Debian Package

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash build-essential curl fakeroot git libtinfo6 libxml2 make perl python3 rsync sudo xz-utils zip

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Surface build failure
        if: failure()
        run: |
          {
            echo "Build failed. Last 80 lines of build.log:"
            tail -n 80 build.log
          } > build-tail.log
          {
            echo "### Build failed"
            echo
            echo '```text'
            cat build-tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AppLibraryEnabler-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppLibraryEnabler-build-log
          path: build.log
          if-no-files-found: ignore
