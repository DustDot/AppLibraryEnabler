name: Build Debian Package

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash build-essential curl fakeroot git libtinfo6 libxml2 make perl python3 rsync sudo xz-utils zip

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: |
          set -o pipefail
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 build.log > build-tail.log
            message=$(python3 -c 'from pathlib import Path; text=Path("build-tail.log").read_text(errors="replace"); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            echo "::error title=Theos build failed::$message"
            {
              echo "### Build failed"
              echo
              echo '```text'
              cat build-tail.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Surface build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -n 80 build.log > build-tail.log
          else
            echo "build.log was not created" > build-tail.log
          fi
          {
            echo "### Build failed"
            echo
            echo '```text'
            cat build-tail.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AppLibraryEnabler-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppLibraryEnabler-build-log
          path: build.log
          if-no-files-found: ignore
