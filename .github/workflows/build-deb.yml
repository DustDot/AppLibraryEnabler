name: Build Debian Package

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash build-essential curl fakeroot git libtinfo6 libxml2 make perl python3 rsync sudo xz-utils zip

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: AppLibraryEnabler-deb
          path: packages/*.deb
          if-no-files-found: error
